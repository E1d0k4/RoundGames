<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RoundGames Installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 32px 20px; }
    .card { border: 1px solid #ddd; border-radius: 16px; padding: 24px; }
    esp-web-install-button { display: inline-block; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>RoundGames</h1>
    <p>Install RoundGames on your Waveshare ESP32-S3-Touch-AMOLED-1.75 directly from your browser.</p>
    <p>Connect the board with USB-C and use a Chromium-based browser.</p>

    <esp-web-install-button manifest="manifest.json">
      <button slot="activate">Install RoundGames</button>
    </esp-web-install-button>
  </div>
</body>
</html>
