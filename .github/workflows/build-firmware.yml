name: Build RoundGames firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware
          command: |
            idf.py build
            idf.py merge-bin -o roundgames-full.bin -f raw

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: roundgames-firmware
          path: firmware/roundgames-full.bin
