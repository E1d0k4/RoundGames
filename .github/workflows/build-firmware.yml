name: Build and publish RoundGames firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -C firmware set-target esp32s3
          idf.py -C firmware build

      - name: Create combined firmware image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware merge-bin -o firmware/roundgames-full.bin -f raw

      - name: Verify firmware image exists
        shell: bash
        run: |
          test -s firmware/roundgames-full.bin
          ls -lh firmware/roundgames-full.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: roundgames-firmware
          path: firmware/roundgames-full.bin
          if-no-files-found: error

      - name: Publish installer firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: RoundGames Nightly
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: firmware/roundgames-full.bin
          fail_on_unmatched_files: true
