name: Build and publish RoundGames firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: roundgames-build-and-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embed firmware version
        shell: bash
        run: |
          printf '#ifndef ROUNDGAMES_BUILD_VERSION_H\n#define ROUNDGAMES_BUILD_VERSION_H\n#define ROUNDGAMES_BUILD_VERSION "%s"\n#endif\n' "${GITHUB_SHA::12}" > firmware/main/build_version.h

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -C firmware set-target esp32s3
          idf.py -C firmware build

      - name: Create combined firmware image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware merge-bin -o roundgames-full.bin -f raw
          mv firmware/build/roundgames-full.bin firmware/roundgames-full.bin

      - name: Verify firmware image exists
        shell: bash
        run: |
          test -s firmware/roundgames-full.bin
          ls -lh firmware/roundgames-full.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: roundgames-firmware
          path: firmware/roundgames-full.bin
          if-no-files-found: error

      - name: Prepare web installer
        shell: bash
        run: |
          VERSIONED_BIN="roundgames-${GITHUB_SHA::12}.bin"
          rm -f web-installer/roundgames-*.bin
          cp firmware/roundgames-full.bin "web-installer/${VERSIONED_BIN}"
          test -s "web-installer/${VERSIONED_BIN}"
          cat > web-installer/manifest.json <<EOF
          {
            "name": "RoundGames",
            "version": "${GITHUB_SHA::12}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  {
                    "path": "./${VERSIONED_BIN}",
                    "offset": 0
                  }
                ]
              }
            ]
          }
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-installer

      - name: Deploy Pages installer
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: sleep 90

      - name: Deploy Pages installer (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Verify published installer and firmware
        shell: bash
        env:
          EXPECTED_VERSION: ${GITHUB_SHA::12}
        run: |
          if [[ "${{ steps.deployment.outcome }}" == "failure" && "${{ steps.deployment_retry.outcome }}" != "success" ]]; then
            echo "Both GitHub Pages deployment attempts failed."
            exit 1
          fi

          BASE_URL="https://e1d0k4.github.io/RoundGames"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 \\
            "${BASE_URL}/manifest.json" -o /tmp/roundgames-manifest.json
          echo "Published manifest:"
          cat /tmp/roundgames-manifest.json

          ACTUAL_VERSION="$(jq -r '.version' /tmp/roundgames-manifest.json)"
          BIN_PATH="$(jq -r '.builds[0].parts[0].path' /tmp/roundgames-manifest.json)"
          EXPECTED_BIN="./roundgames-${EXPECTED_VERSION}.bin"
          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" || "$BIN_PATH" != "$EXPECTED_BIN" ]]; then
            echo "Published manifest is stale or points to the wrong firmware."
            echo "Expected version=$EXPECTED_VERSION path=$EXPECTED_BIN; got version=$ACTUAL_VERSION path=$BIN_PATH"
            exit 1
          fi

          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 10 \\
            "${BASE_URL}/${BIN_PATH#./}" -o /tmp/roundgames-published.bin
          test -s /tmp/roundgames-published.bin
          cmp firmware/roundgames-full.bin /tmp/roundgames-published.bin
          echo "Published manifest and firmware match commit ${EXPECTED_VERSION}."

      - name: Publish installer firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: RoundGames Nightly
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: firmware/roundgames-full.bin
          fail_on_unmatched_files: true
